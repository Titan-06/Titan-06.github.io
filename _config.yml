# Site Configuration for Syed Alkama Adib (Titan) Portfolio
title: "Titan"
email: "syedalkama2419@gmail.com"
description: "Systems software engineering, compilers, computer architecture, and low-level C programming."
author: "Syed Alkama Adib"
url: ""
baseurl: ""

# Markdown and Syntax Highlighting
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

theme: null
future: true

# Exclusion list
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - bin
